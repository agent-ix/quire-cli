[package]
name = "quire-cli"
version = "0.23.0"
edition = "2021"
rust-version = "1.75"
description = "Static binary CLI wrapping quire-rs (parse, extract, lookup, edit, validate, schema)."
authors = ["Agent IX <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-cli"

[lib]
name = "quire_cli"
path = "src/lib.rs"

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
quire-rs = { git = "https://github.com/agent-ix/quire-rs", tag = "v0.34.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
glob = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# quire-rs FR-055 publishes the output-contract schemas; this crate assembles
# the `properties` envelope, so the envelope's conformance test lives here.
# `draft202012` is a non-default `jsonschema` feature and the schemas declare
# that draft, so the test validates them as what they claim.
jsonschema = { version = "~0.18", default-features = false, features = ["draft202012"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true          # drop symbols — smaller distributed binary
panic = "abort"       # no unwinder; a panic SIGABRTs → exit 134 (matches FR-007)
