[package]
name = "quire-cli"
version = "0.32.0"
edition = "2021"
rust-version = "1.98.1"
description = "Static binary CLI wrapping quire-rs (parse, extract, lookup, edit, validate, schema)."
authors = ["Agent IX <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-cli"

[lib]
name = "quire_cli"
path = "src/lib.rs"

[[bin]]
name = "quire"
path = "src/main.rs"

[dependencies]
quire-rs = { version = "=0.46.0", git = "https://github.com/agent-ix/quire-rs", rev = "85dfe9d5a937c52af6456f2e6aa3a6bc4c82db9f" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
glob = "0.3"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
quire-qualify = { version = "=0.1.0", path = "tools/quire-qualify" }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# quire-rs FR-055 publishes the output-contract schemas; this crate assembles
# the `properties` envelope, so the envelope's conformance test lives here.
# `draft202012` is a non-default `jsonschema` feature and the schemas declare
# that draft, so the test validates them as what they claim.
jsonschema = { version = "~0.18", default-features = false, features = ["draft202012"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true          # drop symbols — smaller distributed binary
panic = "abort"       # no unwinder; a panic SIGABRTs → exit 134 (matches FR-007)

[workspace]
members = ["tools/quire-dist", "tools/quire-qualify"]
default-members = ["."]
resolver = "2"
