name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z), without the leading v."
        required: true
      # This workflow is dispatch-only by policy — CI never runs on push, PR or
      # merge. That left both publish steps, which were gated on
      # `github.event_name == 'push'`, permanently unreachable: a dispatch built
      # four binaries and skipped the GitHub Release and the npm publish alike.
      # Publishing is
      # an explicit input instead, so the trigger stays manual and the default
      # stays a dry run.
      publish:
        description: "Create the GitHub Release and publish to npm. Leave false for a dry run."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for npm Trusted Publishing (public npm)

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Tolerate the reserved Windows name tests/fixtures/contexts/CON.json when
      # git validates tree paths during checkout. Combined with the sparse
      # checkout below (which never materializes tests/ on disk), this lets the
      # win32 job clone. Honored by every git invocation, incl. actions/checkout.
      # No-op on Linux/macOS.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.protectNTFS
      GIT_CONFIG_VALUE_0: "false"
    # A hung step otherwise blocks for GitHub's 6-hour default. `Install musl
    # toolchain` hung twice in a row on the x86_64 runner,
    # both times leaving the release in_progress with three of four builds
    # green — a release that never finishes and never fails. 25 minutes is
    # comfortably above the ~10 a healthy build takes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      # Sparse checkout: building the binary only needs the crate sources and the
      # root manifests. This also skips tests/fixtures, which contains an upstream
      # fixture named CON.json — a reserved device name that git cannot check out
      # on Windows (would fail the win32 job at checkout).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            benches
            tools

      - name: Authenticate cargo git fetch (private quire-rs)
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        # Retried, and each attempt bounded. A single `apt-get update` against a
        # slow mirror is the step that hung two releases; without a per-attempt
        # timeout the retry never gets a turn.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update \
              && timeout 240 sudo apt-get install -y musl-tools; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          echo "musl-tools could not be installed after 3 attempts" >&2
          exit 1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test (--version)
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/quire
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version

      # Guard: the binary's own version must match the version being released.
      # The smoke test above only proves the binary runs; a release cut without
      # running `make set-version VERSION=...` would otherwise ship binaries that
      # report a stale version.
      - name: Assert binary version matches release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
          else
            EXPECTED="${GITHUB_REF_NAME#v}"
          fi
          BIN=target/${{ matrix.target }}/release/quire
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          cargo run --locked -p quire-dist -- verify-binary \
            --version "$EXPECTED" --binary "$BIN"

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/quire.exe" "dist/${{ matrix.target }}/quire.exe"
          else
            cp "target/${{ matrix.target }}/release/quire" "dist/${{ matrix.target }}/quire"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package + publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # The release is cut against the dispatched --ref, so the tag is
          # derived from the resolved version rather than read from
          # GITHUB_REF_NAME, which is a branch name when the ref is a branch.
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*

      - name: Normalize binary artifact layout
        run: |
          mkdir -p normalized
          for artifact_dir in artifacts/bin-*; do
            target="${artifact_dir#artifacts/bin-}"
            mkdir -p "normalized/${target}"
            cp "${artifact_dir}"/quire* "normalized/${target}/"
          done
          rm -rf artifacts
          mv normalized artifacts

      - name: Build release tarballs + checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release
          cd artifacts
          for target in */; do
            target="${target%/}"
            if [ -f "$target/quire.exe" ]; then
              (cd "$target" && zip -q "../../release/quire-${VERSION}-${target}.zip" quire.exe)
            else
              tar -czf "../release/quire-${VERSION}-${target}.tar.gz" -C "$target" quire
            fi
          done
          cd ../release
          sha256sum * > "SHA256SUMS.txt"
          ls -la

      - name: Create GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; keeping its published assets."
          else
            gh release create "${TAG}" release/* \
              --title "${TAG}" \
              --notes "Automated release ${TAG}. See CHANGELOG.md for details." \
              --verify-tag
          fi

      # Packaging and the npm publish are owned by the shared action, which
      # also verifies what the registry serves afterwards. It reads
      # artifacts/<rust-target>/quire[.exe] (the layout normalized above).
      # static-musl: the Linux binaries are fully static musl builds that run
      # on glibc as well, so their packages carry no libc restriction.
      # Public npm via OIDC Trusted Publishing (id-token: write above); the
      # NPM_TOKEN secret is only a first-publish bootstrap and may be unset.
      - name: Package and publish the npm distribution
        uses: agent-ix/nodejs-actions/publish-native-npm@main
        with:
          package: "@agent-ix/quire-cli"
          binary: quire
          version: ${{ steps.ver.outputs.version }}
          artifacts-dir: artifacts
          repository: ${{ github.repository }}
          description: "Static CLI over quire-rs (parse, extract, lookup, edit, validate, schema, lint) for Markdown artifacts."
          self-update-command: update
          static-musl: "true"
          npm-token: ${{ secrets.NPM_TOKEN }}
          publish: ${{ inputs.publish }}

      - name: Smoke the published npm packages
        if: inputs.publish
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          PREFIX="$(mktemp -d)"
          NPMRC="$(mktemp)"
          printf '@agent-ix:registry=https://registry.npmjs.org/\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          export NPM_CONFIG_PREFIX="$PREFIX"
          export PATH="$PREFIX/bin:$PATH"

          # Public npm can take a little while to serve a just-published
          # version; retry with backoff rather than failing on propagation.
          attempt=0
          max_attempts=8
          until npm install --global "@agent-ix/quire-cli@${VERSION}"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm install of @agent-ix/quire-cli@${VERSION} did not succeed after $attempt attempts" >&2
              exit 1
            fi
            sleep 15
          done

          actual_version="$(quire --version | cut -d' ' -f2)"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "::error::quire --version printed '$actual_version', expected '$VERSION'" >&2
            exit 1
          fi

          if quire update 2>update.err; then
            echo "::error::quire update exited 0 under an npm install; it must defer to npm instead" >&2
            cat update.err >&2
            exit 1
          fi
          if ! grep -q "npm install -g @agent-ix/quire-cli@latest" update.err; then
            echo "::error::quire update's stderr did not name the exact npm command to run" >&2
            cat update.err >&2
            exit 1
          fi
