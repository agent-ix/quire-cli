name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z), without the leading v."
        required: true
      # This workflow is dispatch-only by policy — CI never runs on push, PR or
      # merge. That left both publish steps, which were gated on
      # `github.event_name == 'push'`, permanently unreachable: a dispatch built
      # four binaries and skipped the GitHub Release and the npm publish alike.
      # npm sat at 0.4.1 against a 0.11.0 Cargo.toml as a result. Publishing is
      # an explicit input instead, so the trigger stays manual and the default
      # stays a dry run.
      publish:
        description: "Create the GitHub Release and publish to npm. Leave false for a dry run."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for npm Trusted Publishing (public npm)

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Tolerate the reserved Windows name tests/fixtures/contexts/CON.json when
      # git validates tree paths during checkout. Combined with the sparse
      # checkout below (which never materializes tests/ on disk), this lets the
      # win32 job clone. Honored by every git invocation, incl. actions/checkout.
      # No-op on Linux/macOS.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.protectNTFS
      GIT_CONFIG_VALUE_0: "false"
    # A hung step otherwise blocks for GitHub's 6-hour default. `Install musl
    # toolchain` hung twice in a row on the x86_64 runner (v0.24.0 and v0.25.0),
    # both times leaving the release in_progress with three of four builds
    # green — a release that never finishes and never fails. 25 minutes is
    # comfortably above the ~10 a healthy build takes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      # Sparse checkout: building the binary only needs the crate sources and the
      # root manifests. This also skips tests/fixtures, which contains an upstream
      # fixture named CON.json — a reserved device name that git cannot check out
      # on Windows (would fail the win32 job at checkout).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            src
            benches

      - name: Authenticate cargo git fetch (private quire-rs)
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        # Retried, and each attempt bounded. A single `apt-get update` against a
        # slow mirror is the step that hung two releases; without a per-attempt
        # timeout the retry never gets a turn.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update \
              && timeout 240 sudo apt-get install -y musl-tools; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          echo "musl-tools could not be installed after 3 attempts" >&2
          exit 1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test (--version)
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/quire
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --version

      # Guard: the binary's own version must match the version being released.
      # The smoke test above only proves the binary runs; a release cut without
      # running scripts/set_version.sh would otherwise ship binaries that
      # report a stale version (npm sat at 0.12.0 against a 0.23.0 Cargo.toml
      # for exactly this class of drift).
      - name: Assert binary version matches release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ github.event.inputs.version }}"
          else
            EXPECTED="${GITHUB_REF_NAME#v}"
          fi
          BIN=target/${{ matrix.target }}/release/quire
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          ACTUAL="$("$BIN" --version | awk '{print $2}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::binary reports version ${ACTUAL} but the release version is ${EXPECTED}." \
              " Run scripts/set_version.sh ${EXPECTED} and commit before releasing."
            exit 1
          fi
          echo "binary version ${ACTUAL} matches release version ${EXPECTED}"

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/quire.exe" "dist/${{ matrix.target }}/quire.exe"
          else
            cp "target/${{ matrix.target }}/release/quire" "dist/${{ matrix.target }}/quire"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package + publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # The release is cut against the dispatched --ref, so the tag is
          # derived from the resolved version rather than read from
          # GITHUB_REF_NAME, which is a branch name when the ref is a branch.
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: bin-*

      - name: Normalize binary artifact layout
        run: |
          mkdir -p normalized
          for artifact_dir in artifacts/bin-*; do
            target="${artifact_dir#artifacts/bin-}"
            mkdir -p "normalized/${target}"
            cp "${artifact_dir}"/quire* "normalized/${target}/"
          done
          rm -rf artifacts
          mv normalized artifacts

      - name: Build release tarballs + checksums
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release
          cd artifacts
          for target in */; do
            target="${target%/}"
            if [ -f "$target/quire.exe" ]; then
              (cd "$target" && zip -q "../../release/quire-${VERSION}-${target}.zip" quire.exe)
            else
              tar -czf "../release/quire-${VERSION}-${target}.tar.gz" -C "$target" quire
            fi
          done
          cd ../release
          sha256sum * > "SHA256SUMS.txt"
          ls -la

      - name: Create GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "${TAG}" release/* \
            --title "${TAG}" \
            --notes "Automated release ${TAG}. See CHANGELOG.md for details." \
            --verify-tag

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.15.0"   # exact; OIDC Trusted Publishing requires Node >= 22.14

      # OIDC Trusted Publishing needs npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.6.2

      # Public npm via OIDC: route @agent-ix at registry.npmjs.org with no auth
      # token. `npm publish` performs the tokenless OIDC token exchange (the
      # id-token: write permission above supplies the GitHub OIDC token).
      # Written to $HOME so every `npm publish` (run from each package dir) picks it up.
      # Public npm. Steady state is tokenless OIDC (id-token: write above). The
      # NPM_TOKEN fallback exists only to BOOTSTRAP: npm requires a package to
      # exist before a trusted publisher can be attached, and these 5 packages'
      # binaries can only be built by this CI matrix. Add NPM_TOKEN as a repo
      # secret for the first release, configure the trusted publishers on
      # npmjs.com, then DELETE the secret — every later release uses OIDC.
      # provenance=false: this repo is private, where provenance is unsupported.
      - name: Configure npm for public npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf 'registry=https://registry.npmjs.org/\n@agent-ix:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\nprovenance=false\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          else
            printf 'registry=https://registry.npmjs.org/\n@agent-ix:registry=https://registry.npmjs.org/\nprovenance=false\n' > "$HOME/.npmrc"
          fi

      - name: Generate per-platform npm packages
        run: ARTIFACTS_DIR=artifacts node npm/build-packages.mjs "${{ steps.ver.outputs.version }}"

      - name: Publish to public npm
        if: inputs.publish
        run: |
          set -e
          # Platform packages first so the launcher's optionalDependencies resolve.
          for pkg in npm/dist/*/; do
            echo "publishing $pkg"
            (cd "$pkg" && npm publish)
          done
          echo "publishing launcher"
          (cd npm/quire-cli && npm publish)
