name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Require private dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private quire-rs dependencies"; exit 1; }
      - name: Authenticate cargo git fetch (private quire-rs)
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Unsafe audit
        run: make audit-unsafe

      - name: Thin-boundary audit
        run: make audit-thin-boundary

  licenses:
    name: Dependency Policy Check
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Require private dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private quire-rs dependencies"; exit 1; }
      - name: Authenticate cargo git fetch (private quire-rs)
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8
      - name: cargo deny check
        run: make deny
      - name: cargo deny check bans
        run: make deny-bans

  bench:
    name: Latency budget (NFR-001)
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Require private dependency token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: test -n "$REGISTRY_TOKEN" || { echo "::error::REGISTRY_TOKEN must read private quire-rs dependencies"; exit 1; }
      - name: Authenticate cargo git fetch (private quire-rs)
        run: git config --global url."https://x-access-token:${{ secrets.REGISTRY_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine@1.20.0
      - name: Run bench (p95 ≤ 50 ms gate)
        run: make bench
