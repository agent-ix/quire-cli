[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"
# NFR-004: no network. Deny every HTTP / RPC client crate so a future
# transitive dep can't sneak the process out of the sandbox.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "tonic" },
    { name = "surf" },
    { name = "ureq" },
]

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/agent-ix/quire-rs",
    "https://github.com/agent-ix/ix-trace-rs",
    # PLAT-850: quire-rs 456f73f (PLAT-843), an ancestor of the pinned
    # 523e47f, ports rust.rs symbol extraction to tree-sitter via
    # quire-code-parse, pulling this repo in transitively.
    "https://github.com/agent-ix/quire-code-rs",
    # quire-rs embeds the semantic-core and module-manifest schemas from
    # filament-core-data's agent-ix-semantic-schema crate.
    "https://github.com/agent-ix/filament-core-data",
]
