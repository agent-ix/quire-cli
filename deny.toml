[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# MIT-0 is permitted only for this transitive crate; keep it out of the
# workspace-wide license allow-list.
exceptions = [
    { allow = ["MIT-0"], crate = "borrow-or-share" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"
# NFR-004: no network. Deny every HTTP / RPC client crate so a future
# transitive dep can't sneak the process out of the sandbox.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "tonic" },
    { name = "surf" },
    { name = "ureq" },
    # FR-034 reads git objects in process; no git network transport may link.
    { name = "git2" },
    { name = "libgit2-sys" },
    { name = "openssl-sys" },
    { name = "libssh2-sys" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "gix-transport" },
    { name = "gix-protocol" },
]

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/agent-ix/ix-cli-kit",
    "https://github.com/agent-ix/quire-rs",
    "https://github.com/agent-ix/ix-trace-rs",
    # PLAT-850: quire-rs ports rust.rs symbol extraction to tree-sitter via
    # quire-code-parse (PLAT-843), pulling this repo in transitively.
    "https://github.com/agent-ix/quire-code-rs",
    # quire-rs embeds the semantic-core and module-manifest schemas from
    # filament-core-data's agent-ix-semantic-schema crate.
    "https://github.com/agent-ix/filament-core-data",
]
