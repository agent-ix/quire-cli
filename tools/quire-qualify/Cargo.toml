[package]
name = "quire-qualify"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
default-run = "quire-qualify"
description = "Repository-local qualification tooling for quire-cli"
license = "AGPL-3.0-or-later"

[dependencies]
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
tempfile = "3"
