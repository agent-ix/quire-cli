[package]
name = "quire-dist"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false
default-run = "quire-dist"
description = "Repository-local release and npm distribution tooling for quire-cli"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde_json = "1"
tempfile = "3"
toml_edit = "0.25.13"

[dev-dependencies]
ix-trace-rs = { version = "=0.1.0", git = "https://github.com/agent-ix/ix-trace-rs", rev = "2ce4ebf47f726b9d76388220545cd0abda8a5cfb" }
